name: build-index

# 只在源文件变化时触发；提交生成的 index/school_index.json 本身不在 paths 里，
# 所以不会自触发循环。
on:
  push:
    branches: [main]
    paths:
      - "index/root_index.yaml"
      - "resources/**/adapters.yaml"
      - "resources/**/*.js"
      - "scripts/build_index.py"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build index
        run: python scripts/build_index.py

      - name: Commit generated index
        run: |
          if [ -z "$(git status --porcelain -- index/school_index.json README.md)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/school_index.json README.md
          git commit -m "chore: rebuild school_index.json [skip ci]"
          git push
